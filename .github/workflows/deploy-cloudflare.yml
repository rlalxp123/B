# 이 브랜치에 올리면 GitHub가 게임을 Cloudflare에 자동으로 배포해요.
# 필요한 것: 레포 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 두 개를 넣어두기
name: Cloudflare 배포

on:
  push:
    branches: [claude/solgaleo-lunala-tamagotchi-b3i3cy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 비밀값 확인
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 비밀값이 없어서 배포를 건너뛰어요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare에 배포
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
