<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b2f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>포켓몬 알 키우기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
<style>
  :root {
    --bg1: #241c5c;
    --bg2: #0f0c2e;
    --ink: #1d1840;
    --panel: #fffaf0;
    --sun: #ffb43c;
    --moon: #7c5cf0;
    --good: #47c97a;
    --warn: #ffb43c;
    --bad: #ff5d73;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg2); }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 70%) fixed;
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; justify-content: center;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  [hidden] { display: none !important; }
  #app {
    width: 100%; max-width: 440px;
    padding: max(10px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  header { display: flex; align-items: center; justify-content: space-between; color: #fff; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: -0.5px; white-space: nowrap; }
  header { gap: 6px; }
  header h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  header > div { flex-shrink: 0; }
  @media (max-width: 400px) {
    header h1 { font-size: 14px; letter-spacing: -0.8px; }
    .iconBtn { font-size: 12px; padding: 5px 7px; }
    #soundBtn { padding: 5px 6px; }
  }
  .iconBtn {
    font: inherit; font-size: 14px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.4);
    border-radius: 999px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
  }

  /* 다마고치 기계 */
  #device {
    position: relative;
    padding: 34px 22px 26px;
    border-radius: 48% 48% 42% 42% / 30% 30% 22% 22%;
    background:
      radial-gradient(circle at 25% 15%, rgba(255,255,255,0.55), transparent 30%),
      linear-gradient(135deg, #ffcf5a 0%, #ff9a3c 35%, #a66cf0 65%, #5b3fd0 100%);
    border: 4px solid var(--ink);
    box-shadow: 0 10px 0 rgba(0,0,0,0.35), inset 0 -8px 0 rgba(0,0,0,0.15);
  }
  #device::before, #device::after {
    content: ""; position: absolute; top: 12px; width: 14px; height: 14px; border-radius: 50%;
    border: 3px solid var(--ink);
  }
  #device::before { left: 30%; background: #ffe17a; }
  #device::after { right: 30%; background: #cbb8ff; }
  #nameRow { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 8px; }
  #nameTag {
    background: var(--ink); color: #fff; font-weight: 800; font-size: 15px;
    padding: 4px 14px; border-radius: 999px; border: none; font-family: inherit; cursor: pointer;
  }
  #stageTag { font-size: 12px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,0.7); padding: 3px 10px; border-radius: 999px; }

  #screen {
    position: relative; overflow: hidden;
    height: 290px; border-radius: 22px;
    border: 4px solid var(--ink);
    background: linear-gradient(#bfe3ff, #f3e7ff);
    transition: background 0.8s;
    touch-action: manipulation;
  }
  #screen.night { background: linear-gradient(#0d0f36, #2b2266); }
  #screen.sun { background: radial-gradient(circle at 80% 15%, #fff6c8 0 12%, transparent 13%), linear-gradient(#ffd98a, #ffc8de); }
  #screen.moon { background: radial-gradient(circle at 80% 15%, #f4f0ff 0 10%, transparent 11%), linear-gradient(#1c1752, #5c4bc2); }
  #screen.fire { background: radial-gradient(circle at 50% 120%, #ff7a3c 0 30%, transparent 60%), linear-gradient(#ffd6a0, #ff9f7a); }
  #screen.bluefire { background: radial-gradient(circle at 50% 120%, #3aa8ff 0 25%, transparent 60%), linear-gradient(#141a3c, #2a4f9a); }
  #screen.bluefire .twinkle { opacity: 1; }
  #screen.water { background: linear-gradient(#bfefff, #4fb0e0); }
  #screen.spark { background: radial-gradient(circle at 20% 20%, #fffbe0 0 8%, transparent 9%), linear-gradient(#fff4a8, #ffd24a); }
  #screen.forest { background: linear-gradient(#e6f8c8 0 62%, #8cc864 62%); }
  #screen.ice { background: linear-gradient(#f2fcff, #a8e4f2); }
  #screen.fairy { background: radial-gradient(circle at 25% 30%, #fff 0 4%, transparent 5%), linear-gradient(#ffe4f2, #d8ecff); }
  #screen.aura { background: radial-gradient(circle at 50% 60%, #bfe6ff 0 20%, transparent 55%), linear-gradient(#1a2a6a, #3a7ac8); }
  #screen.aura .twinkle { opacity: 1; }
  #screen.dojo { background: linear-gradient(#fff1d6 0 62%, #e0a868 62% 64%, #c98a4b 64%); }
  #sky { position: absolute; inset: 0; pointer-events: none; }
  .twinkle { position: absolute; color: #fff; font-size: 10px; opacity: 0; animation: tw 3s infinite; }
  #screen.night .twinkle, #screen.moon .twinkle { opacity: 1; }
  @keyframes tw { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  #ground {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    width: 140px; height: 22px; border-radius: 50%; background: rgba(29,24,64,0.18);
  }
  #pet {
    position: absolute; left: 50%; bottom: 34px; width: 190px; height: 190px;
    transform: translateX(-50%); cursor: pointer;
  }
  #pet svg { width: 100%; height: 100%; overflow: visible; }
  #petInner { width: 100%; height: 100%; animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  #petInner.egg { animation: wobble 2.6s ease-in-out infinite; }
  #petInner.egg.hot { animation: wobble 0.9s ease-in-out infinite; }
  #petInner.rare svg { animation: shine 1.6s ease-in-out infinite; }
  @keyframes shine { 0%,100% { filter: drop-shadow(0 0 4px #ffe27a); } 50% { filter: drop-shadow(0 0 16px #ffd34a); } }
  #petInner.sleep { animation: breathe 3.2s ease-in-out infinite; }
  #petInner.jump { animation: jump 0.5s ease-out; }
  #petInner.shake { animation: shake 0.12s linear infinite; }
  #petInner.white svg { filter: brightness(0) invert(1) drop-shadow(0 0 12px #fff); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.04, 0.97); } }
  @keyframes wobble { 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(-8deg); } 86% { transform: rotate(8deg); } 93% { transform: rotate(-4deg); } }
  @keyframes jump { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-34px) scale(1.05, 0.95); } 60% { transform: translateY(0) scale(1.08, 0.9); } 100% { transform: translateY(0) scale(1); } }
  @keyframes shake { 0% { transform: translateX(-4px) rotate(-3deg); } 50% { transform: translateX(4px) rotate(3deg); } 100% { transform: translateX(-4px) rotate(-3deg); } }

  #bubble {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: #fff; border: 3px solid var(--ink); border-radius: 16px;
    padding: 5px 12px; font-size: 14px; font-weight: 700; white-space: nowrap;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 3;
  }
  #bubble.show { opacity: 1; }
  #messes { position: absolute; left: 0; right: 0; bottom: 12px; height: 40px; pointer-events: none; }
  .mess { position: absolute; bottom: 0; font-size: 30px; }
  #zzz { position: absolute; right: 22%; top: 22%; font-size: 26px; font-weight: 900; color: #fff; pointer-events: none; }
  #zzz span { display: inline-block; animation: zz 2s infinite; }
  #zzz span:nth-child(2) { animation-delay: 0.4s; font-size: 0.8em; }
  #zzz span:nth-child(3) { animation-delay: 0.8s; font-size: 0.6em; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -24px); } }
  .fx { position: absolute; font-size: 26px; pointer-events: none; animation: rise 1.2s ease-out forwards; z-index: 4; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1); } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 6; }
  #flash.on { opacity: 1; }
  #beam { position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0; }
  #beam.on { animation: beam 1.4s ease-out; }
  @keyframes beam { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

  #story {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 7;
    background: #fff; border: 3px solid var(--ink); border-radius: 12px;
    padding: 8px 12px; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: center;
  }

  /* 미니게임 */
  #game { position: absolute; inset: 0; z-index: 8; background: rgba(13,15,54,0.55); }
  #gameHud { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-around; color: #fff; font-weight: 800; font-size: 16px; }
  .star {
    position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; font-size: 38px; line-height: 54px; text-align: center;
    background: none; border: none; padding: 0; cursor: pointer; animation: pop 0.25s ease-out;
  }
  .star.got { animation: got 0.3s forwards; pointer-events: none; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes got { to { transform: scale(1.8); opacity: 0; } }

  /* 상태 */
  #panel { background: var(--panel); border: 4px solid var(--ink); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
  .stat { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .bar { height: 14px; border-radius: 999px; background: #e7e2f3; border: 2px solid var(--ink); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 50%; background: var(--good); transition: width 0.4s, background 0.4s; }
  .stat b { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  #expRow .bar i { background: linear-gradient(90deg, var(--sun), var(--moon)); }

  #actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .act {
    font: inherit; font-weight: 800; font-size: 14px; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); border-radius: 14px;
    padding: 9px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 4px 0 var(--ink); cursor: pointer;
  }
  .act span { font-size: 24px; line-height: 1; }
  .act:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .act:disabled { opacity: 0.4; }
  .act.special { background: linear-gradient(135deg, #ffe08a, #c9b5ff); }

  /* 모달 */
  #modal { position: fixed; inset: 0; background: rgba(10,8,30,0.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  #modal .card { background: var(--panel); border: 4px solid var(--ink); border-radius: 20px; padding: 18px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  #modal h2 { margin: 0 0 10px; font-size: 20px; text-align: center; }
  #modal p { margin: 6px 0; line-height: 1.5; font-size: 14px; }
  .dex { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 10px; }
  .dexTitle { font-size: 13px; font-weight: 800; margin-top: 6px; }
  .dex div { background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 3px; text-align: center; font-size: 11px; font-weight: 700; word-break: keep-all; }
  .dex svg { width: 100%; height: 60px; }
  .dex .mystery span { display: flex; align-items: center; justify-content: center; height: 60px; font-size: 34px; font-weight: 900; color: #c9c1dc; }
  .dex .unknown svg { filter: brightness(0); opacity: 0.35; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; font: inherit; font-weight: 800; font-size: 15px; padding: 11px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; cursor: pointer; }
  .row button.primary { background: var(--moon); color: #fff; }
  .row button.danger { background: var(--bad); color: #fff; }
  #toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
    padding: 8px 16px; border-radius: 999px; white-space: nowrap; z-index: 30;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  #toast.show { opacity: 0.95; }
  footer { color: rgba(255,255,255,0.6); font-size: 12px; text-align: center; }
  footer a { color: inherit; }
  .log { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .logItem { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 10px 6px 6px; }
  .logItem.now { background: #fff6dc; }
  .logItem svg { width: 64px; height: 64px; }
  .logItem b { font-size: 15px; }
  .logItem small { display: block; font-size: 12px; line-height: 1.45; color: #5a5470; }
  .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #efe8ff; margin-left: 4px; vertical-align: 2px; }
  .sum { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; font-size: 13px; font-weight: 700; }
  .sum span { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; }
  .nickInput { width: 100%; font: inherit; font-size: 18px; font-weight: 700; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 0.45s ease-in-out infinite alternate; }
  @keyframes flick { from { transform: scale(1, 1); } to { transform: scale(0.86, 1.14); } }
  @media (prefers-reduced-motion: reduce) { #petInner, #petInner svg, .twinkle, #zzz span, .flame { animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🥚 포켓몬 알 키우기</h1>
    <div style="display:flex;gap:6px">
      <button class="iconBtn" id="soundBtn" aria-label="소리">🔊</button>
      <button class="iconBtn" id="dexBtn">📖 도감</button>
      <button class="iconBtn" id="logBtn">📜 기록</button>
    </div>
  </header>

  <div id="device">
    <div id="nameRow">
      <button id="nameTag" title="이름 바꾸기">알</button>
      <span id="stageTag">포켓몬 알</span>
    </div>
    <div id="screen">
      <div id="sky"></div>
      <div id="bubble"></div>
      <div id="ground"></div>
      <div id="pet"><div id="petInner"></div></div>
      <div id="zzz" hidden><span>Z</span><span>Z</span><span>Z</span></div>
      <div id="messes"></div>
      <div id="beam"></div>
      <div id="flash"></div>
      <div id="story" hidden></div>
      <div id="game" hidden>
        <div id="gameHud"><span id="gameTime">10</span><span>⭐ <span id="gameScore">0</span></span></div>
      </div>
    </div>
  </div>

  <div id="panel">
    <div class="stat" id="row-hunger"><span>🍬 배부름</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="row-mood"><span>💛 기분</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="row-clean"><span>✨ 청결</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="row-energy"><span>⚡ 체력</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="expRow"><span id="expLabel">🥚 부화</span><div class="bar"><i></i></div><b></b></div>
  </div>

  <div id="actions"></div>
  <footer>함께한 시간 <span id="age">0분</span> · <a href="#" id="resetLink">처음부터</a> · <a href="mewtwo/">뮤츠 게임</a></footer>
</div>

<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const KEY = 'cosmog-tamagotchi-v1';
  const $ = (id) => document.getElementById(id);

  // ---------- 그림 (SVG) ----------
  const INK = '#1d1840';
  const star4 = (x, y, s, fill) =>
    `<path d="M${x} ${y - s}Q${x} ${y} ${x + s} ${y}Q${x} ${y} ${x} ${y + s}Q${x} ${y} ${x - s} ${y}Q${x} ${y} ${x} ${y - s}Z" fill="${fill}"/>`;

  function eyes(lx, rx, y, r, face, iris) {
    if (face === 'sleep' || face === 'closed') {
      return `<path d="M${lx - r} ${y}q${r} ${r * 0.8} ${2 * r} 0M${rx - r} ${y}q${r} ${r * 0.8} ${2 * r} 0" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    }
    if (face === 'happy') {
      return `<path d="M${lx - r} ${y + 3}q${r} ${-r * 1.6} ${2 * r} 0M${rx - r} ${y + 3}q${r} ${-r * 1.6} ${2 * r} 0" stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    }
    let s = '';
    for (const x of [lx, rx]) {
      s += `<ellipse cx="${x}" cy="${y}" rx="${r * 0.85}" ry="${r}" fill="${iris}"/>` +
        `<ellipse cx="${x}" cy="${y + r * 0.25}" rx="${r * 0.5}" ry="${r * 0.6}" fill="${INK}" opacity=".55"/>` +
        `<circle cx="${x - r * 0.3}" cy="${y - r * 0.4}" r="${r * 0.33}" fill="#fff"/>` +
        `<circle cx="${x + r * 0.3}" cy="${y + r * 0.4}" r="${r * 0.14}" fill="#fff"/>`;
    }
    if (face === 'sad') {
      s += `<path d="M${lx - r} ${y - r - 6}l${2 * r} ${-5}M${rx + r} ${y - r - 6}l${-2 * r} ${-5}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
    }
    return s;
  }
  function mouth(x, y, face) {
    if (face === 'happy') return `<path d="M${x - 8} ${y - 2}q8 12 16 0z" fill="#ff6f91" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
    if (face === 'sad') return `<path d="M${x - 6} ${y + 4}q6 -7 12 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (face === 'sleep') return `<ellipse cx="${x}" cy="${y + 1}" rx="3" ry="4" fill="${INK}"/>`;
    return `<path d="M${x - 6} ${y}q6 6 12 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  const cheeks = (lx, rx, y) =>
    `<ellipse cx="${lx}" cy="${y}" rx="7" ry="4.5" fill="#ff8fb8" opacity=".75"/><ellipse cx="${rx}" cy="${y}" rx="7" ry="4.5" fill="#ff8fb8" opacity=".75"/>`;

  // ---------- 알 디자인 (랜덤) ----------
  const EGG_PATH = 'M100 22C148 22 166 102 162 132C158 170 132 188 100 188C68 188 42 170 38 132C34 102 52 22 100 22Z';
  const heart = (x, y, k, fill) =>
    `<path d="M${x} ${y + 9 * k}C${x - 16 * k} ${y - 2 * k} ${x - 6 * k} ${y - 14 * k} ${x} ${y - 4 * k}C${x + 6 * k} ${y - 14 * k} ${x + 16 * k} ${y - 2 * k} ${x} ${y + 9 * k}Z" fill="${fill}"/>`;
  const leafShape = (x, y, k, rot, fill) =>
    `<path d="M${x} ${y}q${10 * k} ${-12 * k} ${22 * k} 0q${-12 * k} ${12 * k} ${-22 * k} 0z" fill="${fill}" stroke="#3f7a2a" stroke-width="1.5" transform="rotate(${rot} ${x} ${y})"/>`;
  const EGGS = {
    star: { name: '별빛 알', g: ['#ffffff', '#efe8ff', '#c7b6f0'], crack: '#5b4aa8', art: () =>
      `<circle cx="78" cy="62" r="11" fill="#3b3a9e"/>${star4(78, 62, 6, '#ffe27a')}
       <circle cx="128" cy="86" r="14" fill="#3b3a9e"/>${star4(128, 86, 8, '#ffe27a')}
       <circle cx="70" cy="140" r="12" fill="#3b3a9e"/>${star4(70, 140, 7, '#ffe27a')}
       <circle cx="132" cy="150" r="9" fill="#ffc94a"/><circle cx="100" cy="112" r="7" fill="#ffc94a"/>` },
    rainbow: { name: '무지개 알', g: ['#ffffff', '#ffffff', '#f1eaff'], crack: '#7a5ac8', art: () =>
      ['#ff8fa3', '#ffc36b', '#fff07a', '#8fe3a0', '#8fd0ff', '#c4a4ff'].map((c, i) =>
        `<rect x="10" y="${40 + i * 24}" width="180" height="24" fill="${c}" transform="rotate(-14 100 100)"/>`).join('') +
      `<path d="M30 70q70 -30 140 0" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>` },
    fire: { name: '불꽃 알', g: ['#fff4d6', '#ffc36b', '#ff7a3c'], crack: '#8a2a10', art: () =>

  // ---------- 상태 ----------
  function fresh(prev) {

      exp: 0, bond: 0, sleeping: false, messes: 0, messAcc: 0,
      age: 0, last: Date.now(),

  }
  let S;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const clamp = (v) => Math.max(0, Math.min(100, v));

  // ---------- 시간 흐름 ----------
  function tick(dt) {
    S.age += dt;
    if (S.stage === 'egg') {
      S.warmth = Math.min(100, S.warmth + dt / 8);
      return;
    }
    if (S.sleeping) {
      S.energy = clamp(S.energy + dt * 0.6);
      S.hunger = clamp(S.hunger - dt / 45);
      S.clean = clamp(S.clean - dt / 70);
      if (S.energy >= 100) { S.sleeping = false; say('잘 잤다! ☀️'); fx('☀️'); }
    } else {
      S.hunger = clamp(S.hunger - dt / 20);
      S.mood = clamp(S.mood - dt / 25);
      S.clean = clamp(S.clean - (dt / 40) * (1 + S.messes * 0.6));
      S.energy = clamp(S.energy - dt / 30);
      S.messAcc += dt;
      while (S.messAcc >= 75) {
        S.messAcc -= 75;
        if (S.messes < 3 && Math.random() < 0.55) S.messes++;
      }
    }
    const ok = S.hunger > 30 && S.mood > 30 && S.clean > 30 && S.energy > 15;
    if (ok) gain(dt / 10);
  }
  function gain(n) {
    if (S.stage === 'egg') return;
    if (NEED[S.stage]) S.exp += n;

  }


  // ---------- 화면 ----------
  const petInner = $('petInner');
  let lastKey = '', blinkUntil = 0, happyUntil = 0;

  function face() {
    if (S.sleeping) return 'sleep';
    if (performance.now() < blinkUntil) return 'closed';
    if (performance.now() < happyUntil) return 'happy';
    const low = Math.min(S.hunger, S.mood, S.clean, S.energy);
    if (low < 25) return 'sad';
    if (S.mood > 80) return 'happy';
    return 'normal';
  }

  function drawPet(force) {
    if (petInner.classList.contains('white')) return; // 진화 연출 중
    const f = face();
    const key = S.stage + f + (S.stage === 'egg' ? Math.floor(S.warmth / 25) + S.egg.id : '');
    if (key === lastKey && !force) return;
    lastKey = key;
    petInner.innerHTML = petSVG(S.stage, f, S.warmth, S.shiny);
    petInner.classList.toggle('egg', S.stage === 'egg');
    petInner.classList.toggle('hot', S.stage === 'egg' && S.warmth >= 70);
    petInner.classList.toggle('rare', S.stage === 'egg' && !!S.egg.gold);

  }

  const ACTIONS = {

      ['sleep', '🌙', '재우기'], ['pat', '🤗', '쓰다듬기'], ['heal', '💊', '약주기'],
    ],
    final: [
      ['feed', '🍬', '밥주기'], ['play', '⭐', '놀기'], ['wash', '🫧', '씻기기'],

  let actionsKey = '';
  function buildActions() {
    const set = S.stage === 'egg' ? 'egg' : NEED[S.stage] ? 'baby' : 'final';
    const key = set + S.stage;
    if (key === actionsKey) return;
    actionsKey = key;

  function setBar(id, v) {

  function render() {

    } else if (NEED[S.stage]) {

    for (const b of document.querySelectorAll('.act')) {
      const id = b.dataset.act;
      let dis = busy;
      if (S.sleeping && id !== 'sleep') dis = true;
      if (id === 'heal') dis = dis || Math.min(S.hunger, S.mood, S.clean, S.energy) >= 25;
      b.disabled = dis;

  // ---------- 효과 ----------
  let bubbleTimer;
  function say(text, ms = 1800) {

  function fx(emoji, count = 1) {

      const e = document.createElement('div');
      e.className = 'fx';

  function jump() {

  function toast(t) {

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const vibrate = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // 소리
  let ac;
  function beep(freq = 660, dur = 0.08, type = 'square', when = 0) {
    if (!S.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + when;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const tune = (notes, step = 0.1) => notes.forEach((f, i) => beep(f, step * 0.9, 'square', i * step));

  // ---------- 행동 ----------
  function onCool(id, ms) {
    const now = performance.now();
    if (cool[id] && now < cool[id]) return true;
    cool[id] = now + ms;
    return false;
  }

  function act(id) {
    if (busy) return;
    if (S.sleeping && id !== 'sleep') { say('쿨쿨… 💤'); return; }
    switch (id) {
      case 'warm':
        if (onCool(id, 600)) return;
        S.warmth = Math.min(100, S.warmth + 9);
        fx('🔥'); beep(520 + S.warmth * 4, 0.07);
        say(S.warmth >= 70 ? '알이 크게 움직여요!' : '따끈따끈…');
        break;
      case 'talk':
        if (onCool(id, 1500)) return;
        S.warmth = Math.min(100, S.warmth + 6);
        fx('🎵', 2); tune([523, 659, 784]);
        say(['♪ 랄라~ 알이 좋아하는 것 같아요', '♪ 알이 살짝 따뜻해졌어요', '♪ 알이 콩닥콩닥 움직여요'][Math.floor(Math.random() * 3)]);
        break;
      case 'pat':
        if (onCool(id, 1200)) return;
        if (S.stage === 'egg') {
          S.warmth = Math.min(100, S.warmth + 4);
          fx('💜'); beep(700);
          say('톡톡…');

          fx('💖', 2); jump(); tune([880, 1046]);

        S.hunger = clamp(S.hunger + 25);

        happyUntil = performance.now() + 1200;
        fx(food(), 2); jump();
        tune([660, 880]);
        say(S.stage === 'cosmoem' ? '별빛을 쭉 흡수했어요' : '냠냠!');

        S.messes = 0; S.clean = 100;

        fx('🫧', 4); tune([1046, 1318, 1568], 0.07);
        say('뽀득뽀득 ✨');

        lastKey = '';
        break;
      case 'heal':
        S.hunger = clamp(Math.max(S.hunger, 40));
        S.clean = clamp(Math.max(S.clean, 40));
        S.energy = clamp(Math.max(S.energy, 40));
        S.mood = clamp(Math.max(S.mood, 35));
        fx('💊'); fx('🩹'); tune([440, 554, 659]);
        say('조금 나아졌어요');
        break;
      case 'play':
        if (S.energy < 15) { say('너무 졸려요… 💤'); return; }
        playGame();
        return;
      case 'move':
        if (S.energy < 20) { say('기운이 없어요…'); return; }
        signature();
        return;
    }
    save(); render();
  }

  // 별 잡기 미니게임
  async function playGame() {
    busy = true; render();
    const g = $('game');
    g.querySelectorAll('.star').forEach((s) => s.remove());
    g.hidden = false;
    let score = 0, left = 10;
    $('gameScore').textContent = 0;
    $('gameTime').textContent = '⏱ 10';
    say('떨어지는 별을 잡아요!', 1500);
    const spawn = setInterval(() => {
      const s = document.createElement('button');
      s.className = 'star';
      s.textContent = Math.random() < 0.2 ? '🌟' : '⭐';
      const bonus = s.textContent === '🌟' ? 2 : 1;
      s.style.left = 12 + Math.random() * 76 + '%';
      s.style.top = 22 + Math.random() * 66 + '%';
      s.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        score += bonus;
        $('gameScore').textContent = score;
        s.classList.add('got');
        beep(900 + score * 20, 0.06);
        setTimeout(() => s.remove(), 300);
      }, { once: true });
      g.appendChild(s);
      setTimeout(() => s.isConnected && !s.classList.contains('got') && s.remove(), 1100);
    }, 520);
    while (left > 0) {
      await wait(1000);
      left--;
      $('gameTime').textContent = '⏱ ' + left;
    }
    clearInterval(spawn);
    await wait(300);
    g.hidden = true;
    g.querySelectorAll('.star').forEach((s) => s.remove());
    S.mood = clamp(S.mood + 10 + score * 2);
    S.energy = clamp(S.energy - 12);
    S.hunger = clamp(S.hunger - 6);
    gain(4 + score * 1.5);
    happyUntil = performance.now() + 2000;
    busy = false;
    fx('⭐', 3); jump(); tune([784, 988, 1175, 1568], 0.09);
    say(`별 ${score}개! 신난다!`, 2200);
    save(); render();
  }

  async function signature() {
    busy = true; render();
    const sun = S.stage !== 'lunala' && S.stage !== 'megax';
    const beam = $('beam');
    beam.style.background = {
      solgaleo: 'radial-gradient(circle at 50% 60%, #fff 0 10%, #ffd34a 25%, rgba(255,120,30,0.6) 50%, transparent 75%)',
      lunala: 'radial-gradient(circle at 50% 60%, #fff 0 8%, #b49bff 25%, rgba(60,30,160,0.7) 50%, transparent 75%)',
      megax: 'radial-gradient(circle at 50% 60%, #fff 0 8%, #8fd8ff 22%, rgba(30,110,255,0.75) 50%, transparent 75%)',
      megay: 'radial-gradient(circle at 50% 60%, #fff 0 8%, #ffd34a 20%, rgba(255,70,20,0.75) 50%, transparent 75%)',
    }[S.stage] || 'radial-gradient(circle at 50% 60%, #fff 0 8%, #ffe9a8 22%, rgba(255,150,60,0.6) 50%, transparent 75%)';
    say(`${S.nick || NAMES[S.stage]}의 ${MOVES[S.stage]}!`, 2000);
    petInner.classList.add('shake');
    tune(sun ? [523, 659, 784, 1046, 1318] : [392, 466, 587, 698, 932], 0.08);
    await wait(700);
    petInner.classList.remove('shake');
    beam.classList.remove('on'); void beam.offsetWidth; beam.classList.add('on');
    vibrate(120);
    fx(ICON[S.stage], 3);
    await wait(1200);
    S.energy = clamp(S.energy - 20);
    S.mood = clamp(S.mood + 12);
    gain(6);
    busy = false;
    save(); render();
  }

  // ---------- 부화 & 진화 ----------
  async function story(text, ms) {
    const el = $('story');
    el.textContent = text;
    el.hidden = false;
    await wait(ms);
  }

  async function hatch() {
    busy = true; render();
    $('bubble').classList.remove('show');
    // 깨어나기 직전에 알 속 친구의 힌트를 알려줘요
    await story(EGG_HINT[S.line], 2000);
    await story('어라…? 알의 상태가…!', 1600);
    petInner.classList.add('shake');
    tune([440, 494, 523, 587], 0.2);
    await wait(1800);
    $('flash').classList.add('on');
    vibrate([80, 60, 160]);
    await wait(600);
    petInner.classList.remove('shake');
    const legend = S.line === 'legend';
    S.stage = legend ? LEGENDS[Math.floor(Math.random() * LEGENDS.length)] : S.line;
    S.shiny = Math.random() < 0.05; // 드물게 이로치 (5%)
    S.hunger = 70; S.mood = 80; S.clean = 100; S.energy = 100; S.exp = 0;
    S.dex[S.stage] = true;
    S.path = [S.stage]; S.born = Date.now();
    if (!NEED[S.stage]) S.raised++; // 처음부터 다 자란 모습으로 태어나는 포켓몬
    lastKey = ''; render();
    $('flash').classList.remove('on');
    tune([523, 659, 784, 1046], 0.12);
    if (legend) {
      fx('🌟', 6); tune([392, 523, 659, 784, 1046, 1318], 0.14); vibrate([100, 60, 100, 60, 300]);
      await story('알이 눈부시게 빛난다…!!', 2000);
      await story(`전설의 포켓몬 ${josa(NAMES[S.stage], '이', '가')} 태어났다! ${ICON[S.stage]}`, 2800);
    } else {
      await story(`알에서 ${josa(NAMES[S.line], '이', '가')} 태어났다! ${LINE_ICON[S.line]}`, 2400);
    }
    if (S.shiny) {
      fx('✨', 6); tune([1318, 1568, 2093, 1568, 2093], 0.08); vibrate([40, 40, 40]);
      await story('어라…? 색깔이 특이해…! ✨ 이로치 포켓몬이다!', 2800);
    }
    $('story').hidden = true;
    busy = false;
    save(); render();
    say(CRY[S.stage]);
    if (!NEED[S.stage]) setTimeout(showFinal, 600);
  }

  async function evolve() {
    busy = true; render();
    $('bubble').classList.remove('show');
    const from = S.stage;
    const nx = NEXT[from];
    const to = Array.isArray(nx) ? nx[Math.floor(Math.random() * nx.length)] : nx;
    const mega = /^mega(x|y|lucario|venusaur|blastoise)$/.test(to);
    await story(mega
      ? `${josa(S.nick || NAMES[from], '이', '가')} 지닌 메가스톤이 반응했다…!`
      : `어라…!? ${S.nick || NAMES[from]}의 모습이…!`, 1800);
    petInner.classList.add('white');
    let delay = 420;
    for (let i = 0; i < 12; i++) {
      petInner.innerHTML = petSVG(i % 2 ? to : from, 'normal', 0, S.shiny);
      beep(i % 2 ? 880 : 660, 0.08);
      await wait(delay);
      delay = Math.max(90, delay * 0.82);
    }
    $('flash').classList.add('on');
    vibrate([100, 50, 100, 50, 250]);
    await wait(700);
    petInner.classList.remove('white');
    const oldName = S.nick || NAMES[from];
    const keepNick = S.nick && S.nick !== NAMES[from];
    S.stage = to;
    if (!keepNick) S.nick = '';
    S.exp = 0;
    S.dex[to] = true;
    S.path.push(to);
    if (!NEED[to]) S.raised++;
    S.mood = clamp(S.mood + 20);
    happyUntil = performance.now() + 3000;
    lastKey = ''; render();
    $('flash').classList.remove('on');
    tune([523, 659, 784, 1046, 784, 1046, 1318], 0.13);
    if (REVEAL[to]) await story(REVEAL[to], 1800);
    await story(`축하합니다! ${josa(oldName, '은', '는')} ${josa(NAMES[to], '으로')} ${mega ? '메가진화' : '진화'}했다!`, 2800);
    $('story').hidden = true;
    busy = false;
    save(); render();
    if (!NEED[to]) setTimeout(showFinal, 600);
  }

  function showFinal() {
    const missing = FINALS.filter((k) => !S.dex[k]).map((k) => NAMES[k]);
    const how = {
      solgaleo: '코스모움은 태양의 힘을 받아 <b>솔가레오</b>로 진화했어요.',
      lunala: '코스모움은 달의 힘을 받아 <b>루나아라</b>로 진화했어요.',
      megax: '리자몽이 메가스톤의 힘으로 <b>메가리자몽X</b>로 메가진화했어요.',
      megay: '리자몽이 메가스톤의 힘으로 <b>메가리자몽Y</b>로 메가진화했어요.',
      hitmonlee: '배루키는 발차기 수련 끝에 <b>시라소몬</b>으로 진화했어요.',
      hitmonchan: '배루키는 펀치 수련 끝에 <b>홍수몬</b>으로 진화했어요.',
      hitmontop: '배루키는 회전 수련 끝에 <b>카포에라</b>로 진화했어요.',
      megalucario: '루카리오가 메가스톤의 힘으로 <b>메가루카리오</b>로 메가진화했어요.',
      venusaur: '이상해풀은 무럭무럭 자라서 <b>이상해꽃</b>으로 진화했어요.',
      raichu: '피카츄는 천둥의 돌의 힘으로 <b>라이츄</b>로 진화했어요.',
      blastoise: '어니부기는 늠름하게 자라서 <b>거북왕</b>으로 진화했어요.',
      megavenusaur: '이상해꽃이 메가스톤의 힘으로 <b>메가이상해꽃</b>으로 메가진화했어요.',
      megablastoise: '거북왕이 메가스톤의 힘으로 <b>메가거북왕</b>으로 메가진화했어요.',
      vaporeon: '이브이는 물의 돌의 힘으로 <b>샤미드</b>로 진화했어요.',
      jolteon: '이브이는 천둥의 돌의 힘으로 <b>쥬피썬더</b>로 진화했어요.',
      flareon: '이브이는 불꽃의 돌의 힘으로 <b>부스터</b>로 진화했어요.',
      espeon: '이브이는 햇살 아래에서 <b>에브이</b>로 진화했어요.',
      umbreon: '이브이는 달빛 아래에서 <b>블래키</b>로 진화했어요.',
      leafeon: '이브이는 이끼 바위의 힘으로 <b>리피아</b>로 진화했어요.',
      glaceon: '이브이는 얼음 바위의 힘으로 <b>글레이시아</b>로 진화했어요.',
      sylveon: '이브이는 요정의 힘으로 <b>님피아</b>로 진화했어요.',
    }[S.stage] || (S.line === 'legend'
      ? `1% 확률로만 만날 수 있는 전설의 포켓몬 <b>${NAMES[S.stage]}</b>${josa(NAMES[S.stage], '이', '가').slice(-1)} 알에서 태어났어요!`
      : S.path.length > 1
        ? `${josa(NAMES[S.path[S.path.length - 2]], '은', '는')} 무럭무럭 자라서 <b>${NAMES[S.stage]}</b>${josa(NAMES[S.stage], '으로').slice(NAMES[S.stage].length)} 진화했어요.`
        : `알에서 <b>${NAMES[S.stage]}</b>${josa(NAMES[S.stage], '이', '가').slice(-1)} 태어났어요!`);
    openModal(`
      <h2>${ICON[S.stage]} ${S.line === 'legend' ? '전설의 ' : ''}${NAMES[S.stage]} 탄생!</h2>
      <div style="height:150px">${petSVG(S.stage, 'happy', 0, S.shiny)}</div>
      <p>${how}</p>
      <p>${missing.length ? `아직 못 만난 최종 진화: <b>${missing.length}마리</b>${missing.length <= 4 ? ` (${missing.join(', ')})` : ''}<br>새 알을 받아서 도전해 보세요!` : '최종 진화를 모두 만났어요! 🎉'}</p>
      <p>계속 함께 놀면서 친밀도를 올리거나, 도감에서 새 알을 받을 수 있어요.</p>
      <div class="row"><button class="primary" data-close>계속 키우기</button></div>`);
  }

  // ---------- 모달 (도감/리셋) ----------
  function openModal(html) {
    $('modalCard').innerHTML = html;
    $('modal').hidden = false;
    $('modalCard').querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
  }
  function closeModal() { $('modal').hidden = true; }
  $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

  // ---------- 키운 기록 ----------
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const fmtDate = (t) => { if (!t) return '?'; const d = new Date(t); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; };
  const fmtAge = (sec) => { const m = Math.floor(sec / 60); return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`; };
  function logItem(r, now) {
    const name = r.nick && r.nick !== NAMES[r.stage] ? `${esc(r.nick)} <small style="display:inline">(${NAMES[r.stage]})</small>` : NAMES[r.stage];
    const badges = (now ? '<span class="badge">키우는 중</span>' : '') + (r.shiny ? '<span class="badge">✨ 이로치</span>' : '') +
      (r.legend ? '<span class="badge">⭐ 전설</span>' : '') + (r.gold ? '<span class="badge">👑 황금 알</span>' : '');
    return `<div class="logItem${now ? ' now' : ''}">${petSVG(r.stage, 'happy', 0, r.shiny)}
      <div><b>${name}</b>${badges}
      <small>${r.path.map((k) => NAMES[k]).join(' → ')}</small>
      <small>📅 ${fmtDate(r.born)}${now ? '부터' : ` ~ ${fmtDate(r.ended)}`} · ⏱ ${fmtAge(r.age)}${r.bond ? ` · 💞 ${r.bond}` : ''}</small></div></div>`;
  }
  $('logBtn').addEventListener('click', () => {
    const H = S.history;
    const cur = S.stage === 'egg' ? '' : logItem(record(), true);
    const sum = `<div class="sum"><span>🐾 ${H.length}마리 키움</span><span>✨ 이로치 ${H.filter((r) => r.shiny).length}</span>` +
      `<span>🌟 최종 진화 ${H.filter((r) => !NEED[r.stage]).length}</span></div>`;
    openModal(`
      <h2>📜 키운 기록</h2>
      ${sum}
      <div class="log">${cur}${H.map((r) => logItem(r, false)).join('') ||
        (cur ? '' : '<p style="text-align:center">아직 기록이 없어요.<br>알을 부화시켜서 키워 보세요!</p>')}</div>
      <p style="font-size:12px;text-align:center">새 알을 받거나 처음부터 시작하면 지금 친구가 기록에 남아요.</p>
      <div class="row"><button data-close>닫기</button></div>`);
  });

  $('dexBtn').addEventListener('click', () => {
    const cell = (k) => {
      const seen = S.dex[k];
      // 못 만난 포켓몬은 그림자도 보여주지 않아요
      return seen ? `<div>${petSVG(k, 'normal')}${NAMES[k]}</div>` : `<div class="mystery"><span>?</span>???</div>`;
    };
    // 계열 구분 없이 한 칸에 모두 (발견한 포켓몬만 이름이 보여요)
    const all = Object.values(LINES).flat();
    const found = all.filter((k) => S.dex[k]).length;
    const cells = `<div class="dexTitle">🐾 발견한 포켓몬 (${found}/${all.length})</div>
      <div class="dex" style="grid-template-columns:repeat(5,1fr)">${all.map(cell).join('')}</div>`;
    const final = !NEED[S.stage] && S.stage !== 'egg';
    openModal(`
      <h2>📖 도감</h2>
      ${cells}
      <p>최종 진화까지 키운 친구: <b>${S.raised}마리</b></p>
      <p>🥚 알에서 누가 태어날지, 무엇으로 진화할지는 모두 랜덤이에요!</p>
      <div class="row">
        ${final ? '<button class="primary" id="newEgg">🥚 새 알 받기</button>' : ''}
        <button data-close>닫기</button>
      </div>`);
    const ne = $('newEgg');
    if (ne) ne.addEventListener('click', () => {
      openModal(`<h2>새 알을 받을까요?</h2>
        <p>지금의 ${esc(josa(S.nick || NAMES[S.stage], '은', '는'))} 📜 키운 기록에 남고, 새로운 알부터 다시 키워요.</p>
        <div class="row"><button class="primary" id="yesEgg">받을래요</button><button data-close>아니요</button></div>`);
      $('yesEgg').addEventListener('click', () => { restart(); closeModal(); toast(S.egg.gold ? '✨ 황금 알을 받았어요!' : '새 알을 받았어요! 🥚'); });
    });
  });

  $('resetLink').addEventListener('click', (e) => {
    e.preventDefault();
    openModal(`<h2>처음부터 시작할까요?</h2>
      <p>지금 키우는 친구와 헤어지고 새 알부터 시작해요. 📜 키운 기록과 도감은 남아요.</p>
      <div class="row"><button class="danger" id="yesReset">처음부터</button><button data-close>취소</button></div>`);
    $('yesReset').addEventListener('click', () => { restart(); closeModal(); toast(S.egg.gold ? '✨ 황금 알을 받았어요!' : '새 알을 받았어요! 🥚'); });
  });

  // 지금 키우는 친구를 기록 한 줄로
  const record = () => ({
    stage: S.stage, nick: S.nick, shiny: !!S.shiny, gold: !!(S.egg && S.egg.gold), legend: S.line === 'legend',
    path: S.path.length ? S.path : [S.stage], born: S.born || 0, ended: Date.now(), age: Math.round(S.age), bond: Math.round(S.bond || 0),
  });
  function restart() {
    if (S.stage !== 'egg') {
      S.history.unshift(record());
      S.history = S.history.slice(0, 100); // 최근 100마리까지
    }
    S = fresh(S);
    lastKey = ''; actionsKey = '';
    save(); render();
  }

  $('nameTag').addEventListener('click', () => {
    if (S.stage === 'egg') { toast('알에서 태어나면 이름을 지어줄 수 있어요'); return; }
    openModal(`<h2>이름 짓기</h2>
      <p>최대 8글자까지 지을 수 있어요.</p>
      <input class="nickInput" id="nickInput" maxlength="8" autocomplete="off">
      <div class="row"><button class="primary" id="nickOk">정하기</button><button data-close>취소</button></div>`);
    const inp = $('nickInput');
    inp.value = S.nick || NAMES[S.stage];
    inp.focus(); inp.select();
    const ok = () => { S.nick = inp.value.trim().slice(0, 8); save(); render(); closeModal(); toast('이름을 정했어요!'); };
    $('nickOk').addEventListener('click', ok);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); });
  });

  $('soundBtn').addEventListener('click', () => {
    S.sound = !S.sound;
    $('soundBtn').textContent = S.sound ? '🔊' : '🔇';
    save();
    if (S.sound) beep(880);
  });
  $('soundBtn').textContent = S.sound ? '🔊' : '🔇';

  $('pet').addEventListener('click', () => act('pat'));

  // 하늘의 반짝이 별
  {
    const sky = $('sky');
    for (let i = 0; i < 14; i++) {
      const t = document.createElement('div');
      t.className = 'twinkle';
      t.textContent = '✦';
      t.style.left = Math.random() * 95 + '%';
      t.style.top = Math.random() * 55 + '%';
      t.style.animationDelay = Math.random() * 3 + 's';
      sky.appendChild(t);
    }
  }

  // ---------- 상태 말풍선 ----------
  let nagAt = 0;
  function nag() {
    if (busy || S.stage === 'egg' || S.sleeping) return;
    const now = performance.now();
    if (now < nagAt) return;
    nagAt = now + 9000;
    if (S.hunger < 30) say('배고파요… 🍬');
    else if (S.energy < 20) say('졸려요… 💤');
    else if (S.clean < 30 || S.messes >= 2) say('씻겨주세요… 🫧');
    else if (S.mood < 30) say('심심해요… ⭐');
  }

  // 자리를 비운 동안의 변화 (최대 8시간)
  {
    const away = Math.min(8 * 3600, Math.max(0, (Date.now() - (S.last || Date.now())) / 1000));
    if (away > 5) tick(away);
    S.last = Date.now();
  }

  // ---------- 메인 루프 ----------
  let prev = Date.now();
  setInterval(() => {
    const now = Date.now();
    const dt = Math.min(60, (now - prev) / 1000);
    prev = now;
    if (!busy) tick(dt);
    S.last = now;
    if (!busy && !S.sleeping) {
      if (S.stage === 'egg' && S.warmth >= 100) hatch();
      else if (NEED[S.stage] && S.exp >= NEED[S.stage]) evolve();
    }
    if (!busy && !S.sleeping && Math.random() < 0.08) {
      blinkUntil = performance.now() + 160;
      setTimeout(() => !busy && drawPet(), 180);
    }
    nag();
    if (S.shiny && !busy && S.stage !== 'egg' && Math.random() < 0.12) fx('✨');
    render();
  }, 1000);
  setInterval(save, 5000);

  // 다른 앱에 갔다 오면 지난 시간만큼 반영
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); return; }
    const away = Math.min(8 * 3600, (Date.now() - prev) / 1000);
    if (away > 5 && !busy) tick(away);
    prev = Date.now();
    render();
  });
  window.addEventListener('pagehide', save);

  render();
  if (S.stage === 'egg' && S.warmth < 5) setTimeout(() => say(S.egg.gold ? '반짝반짝 황금 알이다! ✨' : '새 알이에요! 따뜻하게 해주세요 🔥', 2500), 500);
})();
</script>
</body>
</html>
