<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b2f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>코스모그 키우기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
<style>
  :root {
    --bg1: #241c5c;
    --bg2: #0f0c2e;
    --ink: #1d1840;
    --panel: #fffaf0;
    --sun: #ffb43c;
    --moon: #7c5cf0;
    --good: #47c97a;
    --warn: #ffb43c;
    --bad: #ff5d73;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg2); }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2) 70%) fixed;
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; justify-content: center;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  [hidden] { display: none !important; }
  #app {
    width: 100%; max-width: 440px;
    padding: max(10px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  header { display: flex; align-items: center; justify-content: space-between; color: #fff; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.5px; }
  .iconBtn {
    font: inherit; font-size: 14px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.4);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }

  /* 다마고치 기계 */
  #device {
    position: relative;
    padding: 34px 22px 26px;
    border-radius: 48% 48% 42% 42% / 30% 30% 22% 22%;
    background:
      radial-gradient(circle at 25% 15%, rgba(255,255,255,0.55), transparent 30%),
      linear-gradient(135deg, #ffcf5a 0%, #ff9a3c 35%, #a66cf0 65%, #5b3fd0 100%);
    border: 4px solid var(--ink);
    box-shadow: 0 10px 0 rgba(0,0,0,0.35), inset 0 -8px 0 rgba(0,0,0,0.15);
  }
  #device::before, #device::after {
    content: ""; position: absolute; top: 12px; width: 14px; height: 14px; border-radius: 50%;
    border: 3px solid var(--ink);
  }
  #device::before { left: 30%; background: #ffe17a; }
  #device::after { right: 30%; background: #cbb8ff; }
  #nameRow { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 8px; }
  #nameTag {
    background: var(--ink); color: #fff; font-weight: 800; font-size: 15px;
    padding: 4px 14px; border-radius: 999px; border: none; font-family: inherit; cursor: pointer;
  }
  #stageTag { font-size: 12px; font-weight: 700; color: var(--ink); background: rgba(255,255,255,0.7); padding: 3px 10px; border-radius: 999px; }

  #screen {
    position: relative; overflow: hidden;
    height: 290px; border-radius: 22px;
    border: 4px solid var(--ink);
    background: linear-gradient(#bfe3ff, #f3e7ff);
    transition: background 0.8s;
    touch-action: manipulation;
  }
  #screen.night { background: linear-gradient(#0d0f36, #2b2266); }
  #screen.sun { background: radial-gradient(circle at 80% 15%, #fff6c8 0 12%, transparent 13%), linear-gradient(#ffd98a, #ffc8de); }
  #screen.moon { background: radial-gradient(circle at 80% 15%, #f4f0ff 0 10%, transparent 11%), linear-gradient(#1c1752, #5c4bc2); }
  #sky { position: absolute; inset: 0; pointer-events: none; }
  .twinkle { position: absolute; color: #fff; font-size: 10px; opacity: 0; animation: tw 3s infinite; }
  #screen.night .twinkle, #screen.moon .twinkle { opacity: 1; }
  @keyframes tw { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  #ground {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    width: 140px; height: 22px; border-radius: 50%; background: rgba(29,24,64,0.18);
  }
  #pet {
    position: absolute; left: 50%; bottom: 34px; width: 190px; height: 190px;
    transform: translateX(-50%); cursor: pointer;
  }
  #pet svg { width: 100%; height: 100%; overflow: visible; }
  #petInner { width: 100%; height: 100%; animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
  #petInner.egg { animation: wobble 2.6s ease-in-out infinite; }
  #petInner.egg.hot { animation: wobble 0.9s ease-in-out infinite; }
  #petInner.sleep { animation: breathe 3.2s ease-in-out infinite; }
  #petInner.jump { animation: jump 0.5s ease-out; }
  #petInner.shake { animation: shake 0.12s linear infinite; }
  #petInner.white svg { filter: brightness(0) invert(1) drop-shadow(0 0 12px #fff); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.04, 0.97); } }
  @keyframes wobble { 0%,70%,100% { transform: rotate(0); } 78% { transform: rotate(-8deg); } 86% { transform: rotate(8deg); } 93% { transform: rotate(-4deg); } }
  @keyframes jump { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-34px) scale(1.05, 0.95); } 60% { transform: translateY(0) scale(1.08, 0.9); } 100% { transform: translateY(0) scale(1); } }
  @keyframes shake { 0% { transform: translateX(-4px) rotate(-3deg); } 50% { transform: translateX(4px) rotate(3deg); } 100% { transform: translateX(-4px) rotate(-3deg); } }

  #bubble {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: #fff; border: 3px solid var(--ink); border-radius: 16px;
    padding: 5px 12px; font-size: 14px; font-weight: 700; white-space: nowrap;
    opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 3;
  }
  #bubble.show { opacity: 1; }
  #messes { position: absolute; left: 0; right: 0; bottom: 12px; height: 40px; pointer-events: none; }
  .mess { position: absolute; bottom: 0; font-size: 30px; }
  #zzz { position: absolute; right: 22%; top: 22%; font-size: 26px; font-weight: 900; color: #fff; pointer-events: none; }
  #zzz span { display: inline-block; animation: zz 2s infinite; }
  #zzz span:nth-child(2) { animation-delay: 0.4s; font-size: 0.8em; }
  #zzz span:nth-child(3) { animation-delay: 0.8s; font-size: 0.6em; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -24px); } }
  .fx { position: absolute; font-size: 26px; pointer-events: none; animation: rise 1.2s ease-out forwards; z-index: 4; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1); } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 6; }
  #flash.on { opacity: 1; }
  #beam { position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0; }
  #beam.on { animation: beam 1.4s ease-out; }
  @keyframes beam { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

  #story {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 7;
    background: #fff; border: 3px solid var(--ink); border-radius: 12px;
    padding: 8px 12px; font-size: 15px; font-weight: 700; line-height: 1.4; text-align: center;
  }

  /* 미니게임 */
  #game { position: absolute; inset: 0; z-index: 8; background: rgba(13,15,54,0.55); }
  #gameHud { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-around; color: #fff; font-weight: 800; font-size: 16px; }
  .star {
    position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; font-size: 38px; line-height: 54px; text-align: center;
    background: none; border: none; padding: 0; cursor: pointer; animation: pop 0.25s ease-out;
  }
  .star.got { animation: got 0.3s forwards; pointer-events: none; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes got { to { transform: scale(1.8); opacity: 0; } }

  /* 상태 */
  #panel { background: var(--panel); border: 4px solid var(--ink); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
  .stat { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .bar { height: 14px; border-radius: 999px; background: #e7e2f3; border: 2px solid var(--ink); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 50%; background: var(--good); transition: width 0.4s, background 0.4s; }
  .stat b { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  #expRow .bar i { background: linear-gradient(90deg, var(--sun), var(--moon)); }

  #actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .act {
    font: inherit; font-weight: 800; font-size: 14px; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); border-radius: 14px;
    padding: 9px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 4px 0 var(--ink); cursor: pointer;
  }
  .act span { font-size: 24px; line-height: 1; }
  .act:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .act:disabled { opacity: 0.4; }
  .act.special { background: linear-gradient(135deg, #ffe08a, #c9b5ff); }

  /* 모달 */
  #modal { position: fixed; inset: 0; background: rgba(10,8,30,0.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  #modal .card { background: var(--panel); border: 4px solid var(--ink); border-radius: 20px; padding: 18px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  #modal h2 { margin: 0 0 10px; font-size: 20px; text-align: center; }
  #modal p { margin: 6px 0; line-height: 1.5; font-size: 14px; }
  .dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .dex div { background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 4px; text-align: center; font-size: 12px; font-weight: 700; }
  .dex svg { width: 100%; height: 70px; }
  .dex .unknown svg { filter: brightness(0); opacity: 0.35; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; font: inherit; font-weight: 800; font-size: 15px; padding: 11px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; cursor: pointer; }
  .row button.primary { background: var(--moon); color: #fff; }
  .row button.danger { background: var(--bad); color: #fff; }
  #toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
    padding: 8px 16px; border-radius: 999px; white-space: nowrap; z-index: 30;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  #toast.show { opacity: 0.95; }
  footer { color: rgba(255,255,255,0.6); font-size: 12px; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌌 코스모그 키우기</h1>
    <div style="display:flex;gap:6px">
      <button class="iconBtn" id="soundBtn" aria-label="소리">🔊</button>
      <button class="iconBtn" id="dexBtn">📖 도감</button>
    </div>
  </header>

  <div id="device">
    <div id="nameRow">
      <button id="nameTag" title="이름 바꾸기">알</button>
      <span id="stageTag">포켓몬 알</span>
    </div>
    <div id="screen">
      <div id="sky"></div>
      <div id="bubble"></div>
      <div id="ground"></div>
      <div id="pet"><div id="petInner"></div></div>
      <div id="zzz" hidden><span>Z</span><span>Z</span><span>Z</span></div>
      <div id="messes"></div>
      <div id="beam"></div>
      <div id="flash"></div>
      <div id="story" hidden></div>
      <div id="game" hidden>
        <div id="gameHud"><span id="gameTime">10</span><span>⭐ <span id="gameScore">0</span></span></div>
      </div>
    </div>
  </div>

  <div id="panel">
    <div class="stat" id="row-hunger"><span>🍬 배부름</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="row-mood"><span>💛 기분</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="row-clean"><span>✨ 청결</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="row-energy"><span>⚡ 체력</span><div class="bar"><i></i></div><b></b></div>
    <div class="stat" id="expRow"><span id="expLabel">🥚 부화</span><div class="bar"><i></i></div><b></b></div>
  </div>

  <div id="actions"></div>
  <footer>함께한 시간 <span id="age">0분</span> · <a href="#" id="resetLink">처음부터</a> · <a href="mewtwo/">뮤츠 게임</a></footer>
</div>

<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const KEY = 'cosmog-tamagotchi-v1';
  const $ = (id) => document.getElementById(id);

  // ---------- 그림 (SVG) ----------
  const INK = '#1d1840';
  const star4 = (x, y, s, fill) =>
    `<path d="M${x} ${y - s}Q${x} ${y} ${x + s} ${y}Q${x} ${y} ${x} ${y + s}Q${x} ${y} ${x - s} ${y}Q${x} ${y} ${x} ${y - s}Z" fill="${fill}"/>`;

  function eyes(lx, rx, y, r, face, iris) {
    if (face === 'sleep' || face === 'closed') {
      return `<path d="M${lx - r} ${y}q${r} ${r * 0.8} ${2 * r} 0M${rx - r} ${y}q${r} ${r * 0.8} ${2 * r} 0" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    }
    if (face === 'happy') {
      return `<path d="M${lx - r} ${y + 3}q${r} ${-r * 1.6} ${2 * r} 0M${rx - r} ${y + 3}q${r} ${-r * 1.6} ${2 * r} 0" stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    }
    let s = '';
    for (const x of [lx, rx]) {
      s += `<ellipse cx="${x}" cy="${y}" rx="${r * 0.85}" ry="${r}" fill="${iris}"/>` +
        `<ellipse cx="${x}" cy="${y + r * 0.25}" rx="${r * 0.5}" ry="${r * 0.6}" fill="${INK}" opacity=".55"/>` +
        `<circle cx="${x - r * 0.3}" cy="${y - r * 0.4}" r="${r * 0.33}" fill="#fff"/>` +
        `<circle cx="${x + r * 0.3}" cy="${y + r * 0.4}" r="${r * 0.14}" fill="#fff"/>`;
    }
    if (face === 'sad') {
      s += `<path d="M${lx - r} ${y - r - 6}l${2 * r} ${-5}M${rx + r} ${y - r - 6}l${-2 * r} ${-5}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
    }
    return s;
  }
  function mouth(x, y, face) {
    if (face === 'happy') return `<path d="M${x - 8} ${y - 2}q8 12 16 0z" fill="#ff6f91" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
    if (face === 'sad') return `<path d="M${x - 6} ${y + 4}q6 -7 12 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if (face === 'sleep') return `<ellipse cx="${x}" cy="${y + 1}" rx="3" ry="4" fill="${INK}"/>`;
    return `<path d="M${x - 6} ${y}q6 6 12 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  const cheeks = (lx, rx, y) =>
    `<ellipse cx="${lx}" cy="${y}" rx="7" ry="4.5" fill="#ff8fb8" opacity=".75"/><ellipse cx="${rx}" cy="${y}" rx="7" ry="4.5" fill="#ff8fb8" opacity=".75"/>`;

  function eggSVG(warmth) {
    const crack = warmth >= 60
      ? `<path d="M62 92l12 10 8-12 10 14 10-10 12 12 8-10" stroke="#5b4aa8" stroke-width="3.5" fill="none" stroke-linejoin="round"/>` : '';
    const crack2 = warmth >= 85
      ? `<path d="M70 132l10-8 6 10 10-9 9 11 9-8 10 9" stroke="#5b4aa8" stroke-width="3" fill="none" stroke-linejoin="round"/>` : '';
    return `<svg viewBox="0 0 200 200"><defs>
      <radialGradient id="eg" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#efe8ff"/><stop offset="1" stop-color="#c7b6f0"/></radialGradient></defs>
      <path d="M100 22C148 22 166 102 162 132C158 170 132 188 100 188C68 188 42 170 38 132C34 102 52 22 100 22Z" fill="url(#eg)" stroke="${INK}" stroke-width="4"/>
      <circle cx="78" cy="62" r="11" fill="#3b3a9e"/>${star4(78, 62, 6, '#ffe27a')}
      <circle cx="128" cy="86" r="14" fill="#3b3a9e"/>${star4(128, 86, 8, '#ffe27a')}
      <circle cx="70" cy="140" r="12" fill="#3b3a9e"/>${star4(70, 140, 7, '#ffe27a')}
      <circle cx="132" cy="150" r="9" fill="#ffc94a"/>
      <circle cx="100" cy="112" r="7" fill="#ffc94a"/>
      ${crack}${crack2}
      <ellipse cx="76" cy="48" rx="12" ry="6" fill="#fff" opacity=".8" transform="rotate(-30 76 48)"/>
    </svg>`;
  }

  function cosmogSVG(face) {
    return `<svg viewBox="0 0 200 200"><defs>
      <radialGradient id="cgH" cx=".4" cy=".3" r=".75"><stop offset="0" stop-color="#5b52d6"/><stop offset=".6" stop-color="#2d2a8a"/><stop offset="1" stop-color="#17154a"/></radialGradient>
      <radialGradient id="cgP" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#a596ff"/><stop offset="1" stop-color="#4a40b8"/></radialGradient></defs>
      <g fill="url(#cgP)" stroke="${INK}" stroke-width="3">
        <circle cx="26" cy="74" r="15"/><circle cx="22" cy="104" r="14"/><circle cx="42" cy="96" r="22"/>
        <circle cx="174" cy="74" r="15"/><circle cx="178" cy="104" r="14"/><circle cx="158" cy="96" r="22"/>
      </g>
      <circle cx="20" cy="66" r="6" fill="#ffe27a" stroke="${INK}" stroke-width="2"/>
      <circle cx="180" cy="66" r="6" fill="#ffe27a" stroke="${INK}" stroke-width="2"/>
      <path d="M84 150q16 40 32 0q-4 24 -16 30q-12 -6 -16 -30z" fill="#4a40b8" stroke="${INK}" stroke-width="3"/>
      <circle cx="100" cy="100" r="58" fill="url(#cgH)" stroke="${INK}" stroke-width="4"/>
      ${star4(70, 64, 7, '#ffe27a')}${star4(128, 58, 5, '#ffe27a')}${star4(140, 82, 4, '#fff')}${star4(62, 92, 4, '#fff')}${star4(112, 50, 3, '#ffe27a')}
      <ellipse cx="100" cy="116" rx="38" ry="27" fill="#d4dcff" stroke="${INK}" stroke-width="3"/>
      ${eyes(86, 114, 112, 8, face, '#2f3cc0')}
      ${cheeks(72, 128, 124)}
      ${mouth(100, 128, face)}
    </svg>`;
  }

  function cosmoemSVG(face) {
    const extra = face === 'happy'
      ? `${star4(44, 50, 8, '#fff')}${star4(160, 60, 6, '#fff')}`
      : face === 'sad' ? `<path d="M150 64q8 12 0 16q-8 -4 0 -16z" fill="#7fd0ff" stroke="${INK}" stroke-width="2"/>` : '';
    return `<svg viewBox="0 0 200 200"><defs>
      <radialGradient id="ceS" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3b8"/><stop offset=".45" stop-color="#ffc24a"/><stop offset="1" stop-color="#c06a14"/></radialGradient>
      <radialGradient id="ceC" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#4a43c8"/><stop offset="1" stop-color="#120f3d"/></radialGradient></defs>
      <ellipse cx="34" cy="108" rx="11" ry="18" fill="url(#ceS)" stroke="${INK}" stroke-width="3"/>
      <ellipse cx="166" cy="108" rx="11" ry="18" fill="url(#ceS)" stroke="${INK}" stroke-width="3"/>
      <path d="M88 162l12 24 12-24z" fill="#ffc24a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M68 58l14-30 18 18 18-18 14 30z" fill="#ffc24a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="100" cy="106" r="62" fill="url(#ceS)" stroke="${INK}" stroke-width="4"/>
      <ellipse cx="100" cy="120" rx="44" ry="32" fill="url(#ceC)" stroke="${INK}" stroke-width="3"/>
      ${star4(84, 114, 6, '#ffe27a')}${star4(116, 128, 5, '#fff')}${star4(104, 106, 3, '#fff')}${star4(126, 110, 3, '#ffe27a')}${star4(80, 134, 3, '#fff')}
      ${eyes(84, 116, 76, 8, face === 'sleep' ? 'sleep' : 'closed', INK)}
      ${face === 'happy' ? cheeks(70, 130, 86) : ''}
      <ellipse cx="70" cy="62" rx="12" ry="6" fill="#fff" opacity=".7" transform="rotate(-35 70 62)"/>
      ${extra}
    </svg>`;
  }

  function sunburst(cx, cy, ro, ri, n) {
    let d = '';
    for (let i = 0; i < n * 2; i++) {
      const a = (Math.PI * i) / n - Math.PI / 2;
      const r = i % 2 ? ri : ro;
      d += `${i ? 'L' : 'M'}${(cx + Math.cos(a) * r).toFixed(1)} ${(cy + Math.sin(a) * r).toFixed(1)}`;
    }
    return d + 'Z';
  }

  function solgaleoSVG(face) {
    return `<svg viewBox="0 0 200 200"><defs>
      <radialGradient id="sgM" cx=".5" cy=".5" r=".6"><stop offset=".55" stop-color="#ffe066"/><stop offset="1" stop-color="#ff8a1f"/></radialGradient>

  }

  function lunalaSVG(face) {
    return `<svg viewBox="0 0 200 200"><defs>
      <linearGradient id="lnW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a8a"/><stop offset="1" stop-color="#16103f"/></linearGradient>
      <radialGradient id="lnB" cx=".45" cy=".35" r=".8"><stop offset="0" stop-color="#5a46c4"/><stop offset="1" stop-color="#231a5e"/></radialGradient></defs>
      <path d="M72 100C40 60 14 40 2 36C10 70 4 110 16 150C30 140 46 140 58 152C60 130 66 116 76 112Z" fill="url(#lnW)" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M128 100C160 60 186 40 198 36C190 70 196 110 184 150C170 140 154 140 142 152C140 130 134 116 124 112Z" fill="url(#lnW)" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M20 58q30 34 30 82q-14 -40 -30 -82z" fill="#8f7bff" opacity=".8"/>
      <path d="M180 58q-30 34 -30 82q14 -40 30 -82z" fill="#8f7bff" opacity=".8"/>
      ${star4(30, 92, 4, '#fff')}${star4(40, 122, 3, '#ffe27a')}${star4(170, 92, 4, '#fff')}${star4(160, 122, 3, '#ffe27a')}
      <ellipse cx="100" cy="150" rx="34" ry="38" fill="url(#lnB)" stroke="${INK}" stroke-width="4"/>
      <ellipse cx="100" cy="156" rx="18" ry="22" fill="#8f7bff" opacity=".45"/>
      <path d="M54 82C54 30 146 30 146 82C134 50 66 50 54 82Z" fill="#ffd34a" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="100" cy="92" r="40" fill="url(#lnB)" stroke="${INK}" stroke-width="4"/>
      <ellipse cx="100" cy="100" rx="29" ry="24" fill="#eeeaff" stroke="${INK}" stroke-width="3"/>
      <path d="M106 58a10 10 0 1 0 0 16a8 8 0 1 1 0 -16z" fill="#ffe27a"/>
      ${eyes(88, 112, 98, 7.5, face, '#e8457e')}
      ${cheeks(78, 122, 110)}
      ${mouth(100, 114, face)}
    </svg>`;
  }

  const DRAW = { cosmog: cosmogSVG, cosmoem: cosmoemSVG, solgaleo: solgaleoSVG, lunala: lunalaSVG };
  const NAMES = { egg: '포켓몬 알', cosmog: '코스모그', cosmoem: '코스모움', solgaleo: '솔가레오', lunala: '루나아라' };
  const NEED = { cosmog: 120, cosmoem: 180 }; // 진화에 필요한 경험치
  // 받침에 따라 조사 고르기: josa('코스모움', '은', '는') → '코스모움은'
  function josa(word, withB, noB) {
    const c = word.charCodeAt(word.length - 1);
    const has = c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
    if (withB === '으로') return word + ((has && (c - 0xac00) % 28 !== 8) ? '으로' : '로');
    return word + (has ? withB : noB);
  }
  const MOVES = { solgaleo: '메테오드라이브', lunala: '섀도레이' };

  function petSVG(stage, face, warmth) {
    return stage === 'egg' ? eggSVG(warmth || 0) : DRAW[stage](face);
  }

  // ---------- 상태 ----------
  function fresh(prev) {
    return {
      stage: 'egg', nick: '', warmth: 0,
      hunger: 80, mood: 80, clean: 100, energy: 100,
      exp: 0, bond: 0, sleeping: false, messes: 0, messAcc: 0,
      age: 0, last: Date.now(),
      dex: (prev && prev.dex) || {}, raised: (prev && prev.raised) || 0,
      sound: prev ? prev.sound : true,
    };
  }
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.stage) S = fresh();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const clamp = (v) => Math.max(0, Math.min(100, v));

  let busy = false;        // 부화/진화/미니게임 중
  let cool = {};           // 버튼 쿨타임

  // ---------- 시간 흐름 ----------
  function tick(dt) {
    S.age += dt;
    if (S.stage === 'egg') {
      S.warmth = Math.min(100, S.warmth + dt / 8);
      return;
    }
    if (S.sleeping) {
      S.energy = clamp(S.energy + dt * 0.6);
      S.hunger = clamp(S.hunger - dt / 45);
      S.clean = clamp(S.clean - dt / 70);
      if (S.energy >= 100) { S.sleeping = false; say('잘 잤다! ☀️'); fx('☀️'); }
    } else {
      S.hunger = clamp(S.hunger - dt / 20);
      S.mood = clamp(S.mood - dt / 25);
      S.clean = clamp(S.clean - (dt / 40) * (1 + S.messes * 0.6));
      S.energy = clamp(S.energy - dt / 30);
      S.messAcc += dt;
      while (S.messAcc >= 75) {
        S.messAcc -= 75;
        if (S.messes < 3 && Math.random() < 0.55) S.messes++;
      }
    }
    const ok = S.hunger > 30 && S.mood > 30 && S.clean > 30 && S.energy > 15;
    if (ok) gain(dt / 10);
  }
  function gain(n) {
    if (S.stage === 'egg') return;
    if (NEED[S.stage]) S.exp += n;
    else S.bond = Math.min(100, S.bond + n / 3);
  }


  // ---------- 화면 ----------
  const petInner = $('petInner');
  let lastKey = '', blinkUntil = 0, happyUntil = 0;

  function face() {
    if (S.sleeping) return 'sleep';
    if (performance.now() < blinkUntil) return 'closed';
    if (performance.now() < happyUntil) return 'happy';
    const low = Math.min(S.hunger, S.mood, S.clean, S.energy);
    if (low < 25) return 'sad';
    if (S.mood > 80) return 'happy';
    return 'normal';
  }

  function drawPet(force) {
    if (petInner.classList.contains('white')) return; // 진화 연출 중
    const f = face();
    const key = S.stage + f + (S.stage === 'egg' ? Math.floor(S.warmth / 25) : '');
    if (key === lastKey && !force) return;
    lastKey = key;
    petInner.innerHTML = petSVG(S.stage, f, S.warmth);
    petInner.classList.toggle('egg', S.stage === 'egg');
    petInner.classList.toggle('hot', S.stage === 'egg' && S.warmth >= 70);
    petInner.classList.toggle('sleep', S.sleeping);
  }

  const ACTIONS = {
    egg: [
      ['warm', '🔥', '따뜻하게'], ['pat', '🤗', '쓰다듬기'], ['talk', '🎵', '노래하기'],
    ],
    baby: [
      ['feed', '🍬', '밥주기'], ['play', '⭐', '놀기'], ['wash', '🫧', '씻기기'],
      ['sleep', '🌙', '재우기'], ['pat', '🤗', '쓰다듬기'], ['heal', '💊', '약주기'],
    ],
    final: [
      ['feed', '🍖', '밥주기'], ['play', '⭐', '놀기'], ['wash', '🫧', '씻기기'],
      ['sleep', '🌙', '재우기'], ['pat', '🤗', '쓰다듬기'], ['move', '✨', '기술'],
    ],
  };
  let actionsKey = '';
  function buildActions() {
    const set = S.stage === 'egg' ? 'egg' : NEED[S.stage] ? 'baby' : 'final';
    const key = set + S.stage;
    if (key === actionsKey) return;
    actionsKey = key;
    const box = $('actions');
    box.innerHTML = '';
    for (const [id, icon, label] of ACTIONS[set]) {
      const b = document.createElement('button');
      b.className = 'act' + (id === 'move' ? ' special' : '');
      b.dataset.act = id;
      let text = label;
      if (id === 'move') text = MOVES[S.stage];
      if (id === 'sleep') text = '재우기';
      b.innerHTML = `<span>${icon}</span>${text}`;
      b.addEventListener('click', () => act(id));
      box.appendChild(b);
    }
  }

  function setBar(id, v) {
    const row = $(id);
    const i = row.querySelector('i');
    i.style.width = v + '%';
    i.style.background = v < 25 ? 'var(--bad)' : v < 50 ? 'var(--warn)' : 'var(--good)';
    row.querySelector('b').textContent = Math.round(v);
  }

  function render() {
    buildActions();
    drawPet();
    const egg = S.stage === 'egg';
    $('nameTag').textContent = egg ? '???' : (S.nick || NAMES[S.stage]);
    $('stageTag').textContent = NAMES[S.stage];
    $('stageTag').hidden = !egg && $('nameTag').textContent === NAMES[S.stage];
    const scr = $('screen');
    scr.classList.toggle('night', S.sleeping);
    scr.classList.toggle('sun', !S.sleeping && S.stage === 'solgaleo');
    scr.classList.toggle('moon', !S.sleeping && S.stage === 'lunala');
    $('zzz').hidden = !S.sleeping;

    for (const k of ['hunger', 'mood', 'clean', 'energy']) {
      $('row-' + k).style.display = egg ? 'none' : '';
      setBar('row-' + k, S[k]);
    }
    const expRow = $('expRow');
    if (egg) {
      $('expLabel').textContent = '🥚 부화';
      expRow.querySelector('i').style.width = S.warmth + '%';
      expRow.querySelector('b').textContent = Math.floor(S.warmth) + '%';
    } else if (NEED[S.stage]) {
      const p = Math.min(100, (S.exp / NEED[S.stage]) * 100);
      $('expLabel').textContent = '🌟 진화';
      expRow.querySelector('i').style.width = p + '%';
      expRow.querySelector('b').textContent = Math.floor(p) + '%';
    } else {
      $('expLabel').textContent = '💞 친밀도';
      expRow.querySelector('i').style.width = S.bond + '%';
      expRow.querySelector('b').textContent = Math.floor(S.bond);
    }

    // 별 먼지(응가)
    const m = $('messes');
    if (m.childElementCount !== S.messes) {
      m.innerHTML = '';
      const spots = [12, 78, 30];
      for (let i = 0; i < S.messes; i++) {
        const d = document.createElement('div');
        d.className = 'mess';
        d.style.left = spots[i] + '%';
        d.textContent = '💩';
        m.appendChild(d);
      }
    }

    // 버튼 활성/비활성
    for (const b of document.querySelectorAll('.act')) {
      const id = b.dataset.act;
      let dis = busy;
      if (S.sleeping && id !== 'sleep') dis = true;
      if (id === 'heal') dis = dis || Math.min(S.hunger, S.mood, S.clean, S.energy) >= 25;
      b.disabled = dis;
      if (id === 'sleep') b.innerHTML = S.sleeping ? '<span>☀️</span>깨우기' : '<span>🌙</span>재우기';
    }

    const min = Math.floor(S.age / 60);
    $('age').textContent = min < 60 ? `${min}분` : `${Math.floor(min / 60)}시간 ${min % 60}분`;
  }

  // ---------- 효과 ----------
  let bubbleTimer;
  function say(text, ms = 1800) {
    const b = $('bubble');
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => b.classList.remove('show'), ms);
  }
  function fx(emoji, count = 1) {
    const scr = $('screen');
    for (let i = 0; i < count; i++) {
      const e = document.createElement('div');
      e.className = 'fx';
      e.textContent = emoji;
      e.style.left = 35 + Math.random() * 30 + '%';
      e.style.top = 30 + Math.random() * 25 + '%';
      e.style.animationDelay = i * 0.12 + 's';
      scr.appendChild(e);
      setTimeout(() => e.remove(), 1500 + i * 120);
    }
  }
  function jump() {
    petInner.classList.remove('jump');
    void petInner.offsetWidth;
    petInner.classList.add('jump');
    setTimeout(() => petInner.classList.remove('jump'), 520);
  }
  function toast(t) {
    const el = $('toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove('show'), 1600);
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const vibrate = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // 소리
  let ac;
  function beep(freq = 660, dur = 0.08, type = 'square', when = 0) {
    if (!S.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + when;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const tune = (notes, step = 0.1) => notes.forEach((f, i) => beep(f, step * 0.9, 'square', i * step));

  // ---------- 행동 ----------
  function onCool(id, ms) {
    const now = performance.now();
    if (cool[id] && now < cool[id]) return true;
    cool[id] = now + ms;
    return false;
  }

  function act(id) {
    if (busy) return;
    if (S.sleeping && id !== 'sleep') { say('쿨쿨… 💤'); return; }
    switch (id) {
      case 'warm':
        if (onCool(id, 600)) return;
        S.warmth = Math.min(100, S.warmth + 9);
        fx('🔥'); beep(520 + S.warmth * 4, 0.07);
        say(S.warmth >= 70 ? '알이 크게 움직여요!' : '따끈따끈…');
        break;
      case 'talk':
        if (onCool(id, 1500)) return;
        S.warmth = Math.min(100, S.warmth + 6);
        fx('🎵', 2); tune([523, 659, 784]);
        say('알 속에서 무언가 반짝여요');
        break;
      case 'pat':
        if (onCool(id, 1200)) return;
        if (S.stage === 'egg') {
          S.warmth = Math.min(100, S.warmth + 4);
          fx('💜'); beep(700);
          say('톡톡…');
        } else {
          S.mood = clamp(S.mood + 8);
          gain(3);
          happyUntil = performance.now() + 1500;
          fx('💖', 2); jump(); tune([880, 1046]);
          say(S.stage === 'cosmog' ? '삐유~♪' : S.stage === 'cosmoem' ? '(따뜻해…)' : S.stage === 'solgaleo' ? '라오—!' : '룰루—!');
        }
        break;
      case 'feed':
        if (onCool(id, 1000)) return;
        if (S.hunger >= 95) { say('배불러요!'); S.mood = clamp(S.mood - 2); break; }
        S.hunger = clamp(S.hunger + 25);
        gain(8);
        happyUntil = performance.now() + 1200;
        fx(S.stage === 'cosmog' || S.stage === 'cosmoem' ? '🍬' : '🍖', 2); jump();
        tune([660, 880]);
        say(S.stage === 'cosmoem' ? '별빛을 쭉 흡수했어요' : '냠냠!');
        break;
      case 'wash':
        if (onCool(id, 1000)) return;
        if (S.messes === 0 && S.clean >= 95) { say('이미 반짝반짝!'); break; }
        S.messes = 0; S.clean = 100;
        gain(5);
        fx('🫧', 4); tune([1046, 1318, 1568], 0.07);
        say('뽀득뽀득 ✨');
        break;
      case 'sleep':
        S.sleeping = !S.sleeping;
        if (S.sleeping) { tune([523, 392, 330], 0.15); say('잘 자~ 🌙'); }
        else { S.mood = clamp(S.mood - 5); tune([392, 523]); say('으음… 아직 졸린데…'); }
        lastKey = '';
        break;
      case 'heal':
        S.hunger = clamp(Math.max(S.hunger, 40));
        S.clean = clamp(Math.max(S.clean, 40));
        S.energy = clamp(Math.max(S.energy, 40));
        S.mood = clamp(Math.max(S.mood, 35));
        fx('💊'); fx('🩹'); tune([440, 554, 659]);
        say('조금 나아졌어요');
        break;
      case 'play':
        if (S.energy < 15) { say('너무 졸려요… 💤'); return; }
        playGame();
        return;
      case 'move':
        if (S.energy < 20) { say('기운이 없어요…'); return; }
        signature();
        return;
    }
    save(); render();
  }

  // 별 잡기 미니게임
  async function playGame() {
    busy = true; render();
    const g = $('game');
    g.querySelectorAll('.star').forEach((s) => s.remove());
    g.hidden = false;
    let score = 0, left = 10;
    $('gameScore').textContent = 0;
    $('gameTime').textContent = '⏱ 10';
    say('떨어지는 별을 잡아요!', 1500);
    const spawn = setInterval(() => {
      const s = document.createElement('button');
      s.className = 'star';
      s.textContent = Math.random() < 0.2 ? '🌟' : '⭐';
      const bonus = s.textContent === '🌟' ? 2 : 1;
      s.style.left = 12 + Math.random() * 76 + '%';
      s.style.top = 22 + Math.random() * 66 + '%';
      s.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        score += bonus;
        $('gameScore').textContent = score;
        s.classList.add('got');
        beep(900 + score * 20, 0.06);
        setTimeout(() => s.remove(), 300);
      }, { once: true });
      g.appendChild(s);
      setTimeout(() => s.isConnected && !s.classList.contains('got') && s.remove(), 1100);
    }, 520);
    while (left > 0) {
      await wait(1000);
      left--;
      $('gameTime').textContent = '⏱ ' + left;
    }
    clearInterval(spawn);
    await wait(300);
    g.hidden = true;
    g.querySelectorAll('.star').forEach((s) => s.remove());
    S.mood = clamp(S.mood + 10 + score * 2);
    S.energy = clamp(S.energy - 12);
    S.hunger = clamp(S.hunger - 6);
    gain(4 + score * 1.5);
    happyUntil = performance.now() + 2000;
    busy = false;
    fx('⭐', 3); jump(); tune([784, 988, 1175, 1568], 0.09);
    say(`별 ${score}개! 신난다!`, 2200);
    save(); render();
  }

  async function signature() {
    busy = true; render();
    const sun = S.stage === 'solgaleo';
    const beam = $('beam');
    beam.style.background = sun
      ? 'radial-gradient(circle at 50% 60%, #fff 0 10%, #ffd34a 25%, rgba(255,120,30,0.6) 50%, transparent 75%)'
      : 'radial-gradient(circle at 50% 60%, #fff 0 8%, #b49bff 25%, rgba(60,30,160,0.7) 50%, transparent 75%)';
    say(`${S.nick || NAMES[S.stage]}의 ${MOVES[S.stage]}!`, 2000);
    petInner.classList.add('shake');
    tune(sun ? [523, 659, 784, 1046, 1318] : [392, 466, 587, 698, 932], 0.08);
    await wait(700);
    petInner.classList.remove('shake');
    beam.classList.remove('on'); void beam.offsetWidth; beam.classList.add('on');
    vibrate(120);
    fx(sun ? '☀️' : '🌙', 3);
    await wait(1200);
    S.energy = clamp(S.energy - 20);
    S.mood = clamp(S.mood + 12);
    gain(6);
    busy = false;
    save(); render();
  }

  // ---------- 부화 & 진화 ----------
  async function story(text, ms) {
    const el = $('story');
    el.textContent = text;
    el.hidden = false;
    await wait(ms);
  }

  async function hatch() {
    busy = true; render();
    $('bubble').classList.remove('show');
    await story('어라…? 알의 상태가…!', 1600);
    petInner.classList.add('shake');
    tune([440, 494, 523, 587], 0.2);
    await wait(1800);
    $('flash').classList.add('on');
    vibrate([80, 60, 160]);
    await wait(600);
    petInner.classList.remove('shake');
    S.stage = 'cosmog';
    S.hunger = 70; S.mood = 80; S.clean = 100; S.energy = 100; S.exp = 0;
    S.dex.cosmog = true;
    lastKey = ''; render();
    $('flash').classList.remove('on');
    tune([523, 659, 784, 1046], 0.12);
    await story('알에서 코스모그가 태어났다! 🌌', 2400);
    $('story').hidden = true;
    busy = false;
    save(); render();
    say('삐유~!');
  }

  async function evolve() {
    busy = true; render();
    $('bubble').classList.remove('show');
    const from = S.stage;
    const to = from === 'cosmog' ? 'cosmoem' : (Math.random() < 0.5 ? 'solgaleo' : 'lunala');
    await story(`어라…!? ${S.nick || NAMES[from]}의 모습이…!`, 1600);
    petInner.classList.add('white');
    let delay = 420;
    for (let i = 0; i < 12; i++) {
      petInner.innerHTML = petSVG(i % 2 ? to : from, 'normal');
      beep(i % 2 ? 880 : 660, 0.08);
      await wait(delay);
      delay = Math.max(90, delay * 0.82);
    }
    $('flash').classList.add('on');
    vibrate([100, 50, 100, 50, 250]);
    await wait(700);
    petInner.classList.remove('white');
    const oldName = S.nick || NAMES[from];
    const keepNick = S.nick && S.nick !== NAMES[from];
    S.stage = to;
    if (!keepNick) S.nick = '';
    S.exp = 0;
    S.dex[to] = true;
    if (!NEED[to]) S.raised++;
    S.mood = clamp(S.mood + 20);
    happyUntil = performance.now() + 3000;
    lastKey = ''; render();
    $('flash').classList.remove('on');
    tune([523, 659, 784, 1046, 784, 1046, 1318], 0.13);
    if (to === 'cosmoem') {
      await story(`축하합니다! ${josa(oldName, '은', '는')} 코스모움으로 진화했다!`, 2600);
    } else {
      await story(to === 'solgaleo' ? '☀️ 태양의 빛이 쏟아진다…!' : '🌙 달의 빛이 내려앉는다…!', 1800);
      await story(`축하합니다! ${josa(oldName, '은', '는')} ${josa(NAMES[to], '으로')} 진화했다!`, 2800);
    }
    $('story').hidden = true;
    busy = false;
    save(); render();
    if (!NEED[to]) setTimeout(showFinal, 600);
  }

  function showFinal() {
    const other = S.stage === 'solgaleo' ? 'lunala' : 'solgaleo';
    openModal(`
      <h2>${S.stage === 'solgaleo' ? '☀️' : '🌙'} ${NAMES[S.stage]} 탄생!</h2>
      <div style="height:150px">${petSVG(S.stage, 'happy')}</div>
      <p>코스모움은 ${S.stage === 'solgaleo' ? '태양' : '달'}의 힘을 받아 <b>${NAMES[S.stage]}</b>로 진화했어요.</p>
      <p>${S.dex[other] ? '솔가레오와 루나아라를 모두 만났어요! 🎉' : `다음 알에서는 <b>${NAMES[other]}</b>가 나올지도 몰라요. (50% 확률)`}</p>
      <p>계속 함께 놀면서 친밀도를 올리거나, 도감에서 새 알을 받을 수 있어요.</p>
      <div class="row"><button class="primary" data-close>계속 키우기</button></div>`);
  }

  // ---------- 모달 (도감/리셋) ----------
  function openModal(html) {
    $('modalCard').innerHTML = html;
    $('modal').hidden = false;
    $('modalCard').querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
  }
  function closeModal() { $('modal').hidden = true; }
  $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

  $('dexBtn').addEventListener('click', () => {
    const list = ['cosmog', 'cosmoem', 'solgaleo', 'lunala'];
    const cells = list.map((k) => {
      const seen = S.dex[k];
      return `<div class="${seen ? '' : 'unknown'}">${petSVG(k, 'normal')}${seen ? NAMES[k] : '???'}</div>`;
    }).join('');
    const final = !NEED[S.stage] && S.stage !== 'egg';
    openModal(`
      <h2>📖 도감</h2>
      <div class="dex">${cells}</div>
      <p>키워낸 전설: <b>${S.raised}마리</b></p>
      <p>🥚 알 → 코스모그 → 코스모움 → <b>솔가레오</b> 또는 <b>루나아라</b><br>마지막 진화는 50% 랜덤이에요!</p>
      <div class="row">
        ${final ? '<button class="primary" id="newEgg">🥚 새 알 받기</button>' : ''}
        <button data-close>닫기</button>
      </div>`);
    const ne = $('newEgg');
    if (ne) ne.addEventListener('click', () => {
      openModal(`<h2>새 알을 받을까요?</h2>
        <p>지금의 ${josa(S.nick || NAMES[S.stage], '은', '는')} 도감에 기록되고, 새로운 알부터 다시 키워요.</p>
        <div class="row"><button class="primary" id="yesEgg">받을래요</button><button data-close>아니요</button></div>`);
      $('yesEgg').addEventListener('click', () => { restart(); closeModal(); toast('새 알을 받았어요! 🥚'); });
    });
  });

  $('resetLink').addEventListener('click', (e) => {
    e.preventDefault();
    openModal(`<h2>처음부터 시작할까요?</h2>
      <p>지금 키우는 친구와 헤어지고 새 알부터 시작해요. 도감 기록은 남아요.</p>
      <div class="row"><button class="danger" id="yesReset">처음부터</button><button data-close>취소</button></div>`);
    $('yesReset').addEventListener('click', () => { restart(); closeModal(); toast('새 알을 받았어요! 🥚'); });
  });

  function restart() {
    S = fresh(S);
    lastKey = ''; actionsKey = '';
    save(); render();
  }

  $('nameTag').addEventListener('click', () => {
    if (S.stage === 'egg') { toast('알에서 태어나면 이름을 지어줄 수 있어요'); return; }
    const n = prompt('이름을 지어주세요 (최대 8글자)', S.nick || NAMES[S.stage]);
    if (n === null) return;
    S.nick = n.trim().slice(0, 8);
    save(); render();
  });

  $('soundBtn').addEventListener('click', () => {
    S.sound = !S.sound;
    $('soundBtn').textContent = S.sound ? '🔊' : '🔇';
    save();
    if (S.sound) beep(880);
  });
  $('soundBtn').textContent = S.sound ? '🔊' : '🔇';

  $('pet').addEventListener('click', () => act('pat'));

  // 하늘의 반짝이 별
  {
    const sky = $('sky');
    for (let i = 0; i < 14; i++) {
      const t = document.createElement('div');
      t.className = 'twinkle';
      t.textContent = '✦';
      t.style.left = Math.random() * 95 + '%';
      t.style.top = Math.random() * 55 + '%';
      t.style.animationDelay = Math.random() * 3 + 's';
      sky.appendChild(t);
    }
  }

  // ---------- 상태 말풍선 ----------
  let nagAt = 0;
  function nag() {
    if (busy || S.stage === 'egg' || S.sleeping) return;
    const now = performance.now();
    if (now < nagAt) return;
    nagAt = now + 9000;
    if (S.hunger < 30) say('배고파요… 🍬');
    else if (S.energy < 20) say('졸려요… 💤');
    else if (S.clean < 30 || S.messes >= 2) say('씻겨주세요… 🫧');
    else if (S.mood < 30) say('심심해요… ⭐');
  }

  // 자리를 비운 동안의 변화 (최대 8시간)
  {
    const away = Math.min(8 * 3600, Math.max(0, (Date.now() - (S.last || Date.now())) / 1000));
    if (away > 5) tick(away);
    S.last = Date.now();
  }

  // ---------- 메인 루프 ----------
  let prev = Date.now();
  setInterval(() => {
    const now = Date.now();
    const dt = Math.min(60, (now - prev) / 1000);
    prev = now;
    if (!busy) tick(dt);
    S.last = now;
    if (!busy && !S.sleeping) {
      if (S.stage === 'egg' && S.warmth >= 100) hatch();
      else if (NEED[S.stage] && S.exp >= NEED[S.stage]) evolve();
    }
    if (!busy && !S.sleeping && Math.random() < 0.08) {
      blinkUntil = performance.now() + 160;
      setTimeout(() => !busy && drawPet(), 180);
    }
    nag();
    render();
  }, 1000);
  setInterval(save, 5000);

  // 다른 앱에 갔다 오면 지난 시간만큼 반영
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); return; }
    const away = Math.min(8 * 3600, (Date.now() - prev) / 1000);
    if (away > 5 && !busy) tick(away);
    prev = Date.now();
    render();
  });
  window.addEventListener('pagehide', save);

  render();
  if (S.stage === 'egg' && S.warmth < 5) setTimeout(() => say('알을 따뜻하게 해주세요 🔥', 2500), 500);
})();
</script>
</body>
</html>
